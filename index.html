<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post Downloader</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 900px; width: 100%; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #e1306c; }
        .input-box { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #e1306c; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #c1285d; }
        .controls { display: none; justify-content: space-between; align-items: center; margin: 20px 0; padding: 12px; background: #f9f9f9; border-radius: 5px; border: 1px solid #eee; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .post-card { position: relative; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #fff; }
        .post-card img { width: 100%; height: 200px; object-fit: cover; }
        .post-card input[type="checkbox"] { position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; cursor: pointer; z-index: 2; }
        .download-btn { display: block; padding: 8px; background: #3897f0; color: white; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Instagram Post Downloader</h2>
    
    <div class="input-box">
        <input type="text" id="username" placeholder="Instagram Username dalo...">
        <button onclick="fetchPosts()">Fetch Posts</button>
    </div>

    <div class="controls" id="controls">
        <label style="font-weight: bold; cursor: pointer;">
            <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"> Select All
        </label>
        <button onclick="downloadSelected()" style="background: #28a745;">Selected Download</button>
    </div>

    <div class="posts-grid" id="postsContainer"></div>
</div>

<script>
    const mockPosts = [
        { id: 1, url: "https://picsum.photos/400/400?random=1" },
        { id: 2, url: "https://picsum.photos/400/400?random=2" },
        { id: 3, url: "https://picsum.photos/400/400?random=3" },
        { id: 4, url: "https://picsum.photos/400/400?random=4" }
    ];

    function fetchPosts() {
        const username = document.getElementById("username").value.trim();
        if (!username) return alert("Kripya Instagram Username dalein!");

        const container = document.getElementById("postsContainer");
        const controls = document.getElementById("controls");
        container.innerHTML = "";

        mockPosts.forEach((post, i) => {
            const card = document.createElement("div");
            card.className = "post-card";
            card.innerHTML = `
                <input type="checkbox" class="post-checkbox" value="${post.url}">
                <img src="${post.url}" alt="Post ${i + 1}">
                <a href="${post.url}" target="_blank" download="insta_post_${i + 1}.jpg" class="download-btn">Download Image</a>
            `;
            container.appendChild(card);
        });

        controls.style.display = "flex";
    }

    function toggleSelectAll(selectAll) {
        document.querySelectorAll(".post-checkbox").forEach(cb => cb.checked = selectAll.checked);
    }

    function downloadSelected() {
        const selected = document.querySelectorAll(".post-checkbox:checked");
        if (!selected.length) return alert("Kam se kam ek post select karein!");

        selected.forEach((cb, index) => {
            setTimeout(() => {
                const a = document.createElement("a");
                a.href = cb.value;
                a.download = `instagram_post_${index + 1}.jpg`;
                a.target = "_blank";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, index * 500);
        });
    }
</script>

</body>
</html>
